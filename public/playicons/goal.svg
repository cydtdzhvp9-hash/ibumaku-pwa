<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Match existing playicons style: 64x64, single color stroke #1f6b2e -->
  <g stroke="#1f6b2e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- pole -->
    <path d="M18 54V12"/>
    <!-- base -->
    <path d="M10 54H26"/>
    <!-- flag outline -->
    <path id="flagOutline" d="M18 14
      C28 10, 36 18, 46 14
      V30
      C36 34, 28 26, 18 30
      Z"/>
  </g>

  <!-- check pattern clipped inside the flag -->
  <defs>
    <clipPath id="clipFlag">
      <path d="M18 14
        C28 10, 36 18, 46 14
        V30
        C36 34, 28 26, 18 30
        Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clipFlag)">
    <!-- 4x3 checker grid inside approximate flag bounds -->
    <!-- cell size 7x6, starting near (20,16) -->
    <rect x="20" y="16" width="7" height="6" fill="#1f6b2e"/>
    <rect x="34" y="16" width="7" height="6" fill="#1f6b2e"/>
    <rect x="27" y="22" width="7" height="6" fill="#1f6b2e"/>
    <rect x="41" y="22" width="7" height="6" fill="#1f6b2e"/>
    <rect x="20" y="28" width="7" height="6" fill="#1f6b2e"/>
    <rect x="34" y="28" width="7" height="6" fill="#1f6b2e"/>
  </g>
</svg>
